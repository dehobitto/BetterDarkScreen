name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/BetterDarkScreen.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: BetterDarkScreen
          path: publish/BetterDarkScreen.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/BetterDarkScreen.exe
          generate_release_notes: true
