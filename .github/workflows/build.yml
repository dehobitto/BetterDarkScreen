name: build

# lint -> build -> release
#   * every push / PR: dotnet format check + Release build (warnings are errors), exes uploaded as artifact
#     - BetterDarkScreen-<ver>-win-x64.exe        self-contained, fastest start
#     - BetterDarkScreen-<ver>-win-x64-small.exe  self-contained, compressed (~3x smaller, a bit more RAM)
#     Neither needs .NET installed.
#   * push to main: if <Version> in src/BetterDarkScreen.csproj has no tag yet, tag v<Version> and publish a GitHub release
#   * pushing a tag v* yourself also publishes a release for that tag

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/BetterDarkScreen.csproj
  RID: win-x64

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: dotnet format (whitespace, style, analyzers)
        run: dotnet format ${{ env.PROJECT }} --verify-no-changes --severity warn

  build:
    needs: lint
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$p = Get-Content $env:PROJECT
          $v = ($p.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.Substring(1)
            if ($tag -ne $v) { Write-Error "Tag v$tag does not match <Version>$v</Version> in $env:PROJECT"; exit 1 }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Publish (regular)
        run: dotnet publish ${{ env.PROJECT }} -c Release -r ${{ env.RID }} -o out/full -p:TreatWarningsAsErrors=true

      - name: Publish (small, compressed)
        run: dotnet publish ${{ env.PROJECT }} -c Release -r ${{ env.RID }} -o out/small -p:TreatWarningsAsErrors=true -p:EnableCompressionInSingleFile=true

      - name: Name files and checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $base = "BetterDarkScreen-$env:VERSION-$env:RID"
          Copy-Item out/full/BetterDarkScreen.exe  "dist/$base.exe"
          Copy-Item out/small/BetterDarkScreen.exe "dist/$base-small.exe"
          $lines = Get-ChildItem dist/*.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: BetterDarkScreen-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Skip if this version is already released
        id: check
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Bump <Version> in $PROJECT to publish a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.skip == 'false'
        with:
          name: BetterDarkScreen-${{ env.VERSION }}
          path: dist

      - name: Create release v${{ env.VERSION }}
        if: steps.check.outputs.skip == 'false'
        run: |
          cat > notes.md <<EOF
          ## Download

          | File | |
          |---|---|
          | \`BetterDarkScreen-$VERSION-$RID.exe\` | Regular build, fastest start |
          | \`BetterDarkScreen-$VERSION-$RID-small.exe\` | Compressed, ~3x smaller, uses a bit more RAM |

          Both are single files for 64-bit Windows 10/11 and **don't need .NET installed**. Checksums: \`SHA256SUMS.txt\`.

          EOF
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BetterDarkScreen $VERSION" \
            --notes-file notes.md \
            --generate-notes
