<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e2cf"/>
      <stop offset="1" stop-color="#bfb69c"/>
    </linearGradient>
    <radialGradient id="crt" cx="0.45" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#16241b"/>
      <stop offset="1" stop-color="#050807"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#7dff9b" opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Retro CRT monitor -->
  <g transform="translate(40,40)">
    <!-- back shell -->
    <path d="M60 30 L320 30 L350 300 L30 300 Z" fill="#a89f86"/>
    <!-- front bezel -->
    <rect x="0" y="0" width="380" height="320" rx="34" fill="url(#case)" stroke="#2a2720" stroke-width="6"/>
    <!-- screen recess -->
    <rect x="34" y="30" width="312" height="226" rx="40" fill="#3b382f"/>
    <!-- curved glass -->
    <rect x="46" y="42" width="288" height="202" rx="46" ry="40" fill="url(#crt)"/>
    <rect x="46" y="42" width="288" height="202" rx="46" ry="40" fill="url(#scan)"/>
    <!-- prompt on screen -->
    <g filter="url(#glow)" fill="#7dff9b" font-family="Consolas, 'Courier New', monospace" font-weight="700">
      <text x="78" y="120" font-size="34">C:\&gt; dark</text>
      <rect x="78" y="146" width="24" height="34" opacity="0.9"/>
    </g>
    <!-- glare -->
    <path d="M70 62 Q120 50 190 54 Q120 66 82 110 Z" fill="#ffffff" opacity="0.10"/>
    <!-- control strip -->
    <rect x="34" y="270" width="312" height="34" rx="8" fill="#d6ceb6" stroke="#2a2720" stroke-width="3"/>
    <rect x="52" y="281" width="90" height="12" rx="3" fill="#2a2720" opacity="0.55"/>
    <circle cx="270" cy="287" r="9" fill="#2a2720"/>
    <circle cx="300" cy="287" r="9" fill="#2a2720"/>
    <circle cx="326" cy="287" r="5" fill="#46e070"/>
    <!-- stand -->
    <path d="M140 320 L240 320 L262 370 L118 370 Z" fill="#bfb69c" stroke="#2a2720" stroke-width="6" stroke-linejoin="round"/>
    <rect x="80" y="366" width="220" height="24" rx="10" fill="#d6ceb6" stroke="#2a2720" stroke-width="6"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900">
    <text x="480" y="160" font-size="104" fill="#1b1d22" letter-spacing="6">BETTER</text>
    <text x="486" y="296" font-size="140" fill="#0c0f0d" letter-spacing="4"
          stroke="#7dff9b" stroke-width="4" paint-order="stroke">DARK</text>
    <text x="482" y="420" font-size="104" fill="#1b1d22" letter-spacing="6">SCREEN</text>
  </g>
  <!-- underline cursor accent -->
  <rect x="486" y="440" width="560" height="10" rx="5" fill="#46e070"/>
</svg>
